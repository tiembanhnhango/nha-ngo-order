.lb{display:none;position:fixed;inset:0;z-index:50;background:#0d0b0a;flex-direction:column}.lb.on{display:flex}.lbtop{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 6px;color:#fff8ef}.lbtop b{font-size:16px}.lbtop span{color:#c8b8aa;font-size:13px;margin-left:8px}.lbx{width:42px;height:42px;border-radius:50%;border:0;background:#ffffff1a;color:#fff;font-size:20px;cursor:pointer}

</style></head><body class="nobar">
<main class="wrap"><h1>Tiệm Bánh Nhà Ngô</h1><div class="sub">Bánh nướng tươi · Đặt bánh theo đợt</div>
<div class="batches" id="batches"></div><div id="info"></div>
<div class="seg" id="seg" style="display:none"><button id="tabMenu" class="on" onclick="setView('menu')">Đặt bánh</button><button id="tabList" onclick="setView('list')">Đơn trong đợt</button></div>
<div id="view"><div class="loading">Đang tải thực đơn...</div></div></main>
<div class="bar"><div class="barin"><div class="sum"><small id="qt">Chưa chọn bánh</small><strong id="total">0 đ</strong></div><button class="primary" id="order" disabled onclick="openOrder()">Đặt bánh</button></div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<div class="lb" id="lb"><div class="lbtop"><div><b id="lbName"></b><span id="lbCount"></span></div><button class="lbx" onclick="closeAlbum()" aria-label="Đóng">✕</button></div><div class="lbstage" id="lbStage"><img id="lbImg" alt=""><button class="lbnav prev" onclick="lbGo(-1)" aria-label="Ảnh trước">‹</button><button class="lbnav next" onclick="lbGo(1)" aria-label="Ảnh sau">›</button></div><div class="lbthumbs" id="lbThumbs"></div><div class="lbcap"><div><div class="desc" id="lbDesc"></div><div class="price" id="lbPrice"></div></div><button class="lbadd" id="lbAdd" onclick="lbAddCart()">+ Chọn bánh</button></div></div>
<iframe name="submitFrame" id="submitFrame" style="display:none"></iframe><form id="postForm" method="post" target="submitFrame" action="https://script.google.com/macros/s/AKfycbyzJFINy2DsPThTCPLcB1E-1PeUmoQxMChiYcJz6wENkEvzdWebII5gxcCMiGebkx5P/exec" style="display:none"><input name="payload" id="payload"></form>
<script>
const API='https://script.google.com/macros/s/AKfycbyzJFINy2DsPThTCPLcB1E-1PeUmoQxMChiYcJz6wENkEvzdWebII5gxcCMiGebkx5P/exec';
const PRODUCT_IMAGES={B001:'https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=500&q=80',B002:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=500&q=80',B003:'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=500&q=80',B004:'https://images.unsplash.com/photo-1519915028121-7d3463d20b13?auto=format&fit=crop&w=500&q=80',B005:'https://images.unsplash.com/photo-1486427944299-d1955d23e34d?auto=format&fit=crop&w=500&q=80',B006:'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=500&q=80'};
const STEPS=['CHỜ XÁC NHẬN','ĐÃ NHẬN TIỀN','ĐANG LÀM','HOÀN THÀNH'];
const LABEL={'CHỜ XÁC NHẬN':'Chờ xác nhận','ĐÃ NHẬN TIỀN':'Đã nhận tiền','ĐANG LÀM':'Đang làm bánh','HOÀN THÀNH':'Hoàn thành','HỦY':'Đã hủy'};
const ST_CLASS={'CHỜ XÁC NHẬN':'wait','ĐÃ NHẬN TIỀN':'paid','ĐANG LÀM':'making','HOÀN THÀNH':'done','HỦY':'cancel'};
const WD=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'],WDS=['CN','T2','T3','T4','T5','T6','T7'];
const PENDING_KEY='nhango_pending_order',MY_KEY='nhango_my_orders',BATCH_KEY='nhango_batch';
let shop=null,products=[],cart={},cur=null,view='menu',restored=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('vi-VN')+' đ';
const store={get(k,d){try{let v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function jsonp(params){return new Promise((ok,no)=>{let cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),timer=setTimeout(()=>{cleanup();no(Error('Máy chủ phản hồi chậm'))},30000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=x=>{cleanup();ok(x)};s.onerror=()=>{cleanup();no(Error('Không kết nối được máy chủ'))};s.src=API+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.body.appendChild(s)})}
function toast(t){let el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2000)}

/* ---------- TẢI DỮ LIỆU ---------- */
async function load(code,opts={}){
  if(!opts.silent)$('view').innerHTML='<div class="loading">Đang tải...</div>';
  try{
    let r=await jsonp({api:'shop',batch:code||''});
    if(!r||!r.success)throw Error(r&&r.message||'Lỗi tải dữ liệu');
    let prev=cart;shop=r;cur=r.batch?r.batch.code:null;products=r.products||[];cart={};
    products.forEach(p=>cart[p.id]=opts.keepCart?Math.min(prev[p.id]||0,+p.stock):0);
    if(cur){store.set(BATCH_KEY,cur);try{let u=new URL(location.href);u.searchParams.set('dot',cur);history.replaceState(null,'',u)}catch(e){}}
    render();
    if(!restored){restored=true;restorePending()}
  }catch(e){if(!opts.silent)$('view').innerHTML=`<div class="empty">Không tải được dữ liệu.<br><br><button class="mini" onclick="load(cur)">Thử lại</button></div>`}
}
function pick(code){if(code===cur)return;if(totals().qty&&!confirm('Đổi đợt sẽ bỏ các bánh đang chọn. Tiếp tục?'))return;load(code)}
function setView(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'});if(v==='list')load(cur,{silent:true,keepCart:true})}

/* ---------- HIỂN THỊ ---------- */
function dateParts(b){let m=String(b.pickupDate||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;let d=new Date(+m[1],m[2]-1,+m[3]);return{d,short:m[3]+'/'+m[2],wd:d.getDay()}}
function batchStatus(b){if(b.open)return['Đang nhận đơn','open'];if(b.status==='ĐANG MỞ')return['Hết hạn đặt','closed'];if(b.status==='ĐÃ CHỐT')return['Đã chốt đơn','closed'];return['Đã kết thúc','closed']}
function render(){
  let b=shop&&shop.batch;
  $('batches').innerHTML=(shop&&shop.batches||[]).map(x=>{let p=dateParts(x),st=batchStatus(x);return`<button class="chip ${x.code===cur?'on':''} ${x.open?'':'closed'}" onclick="pick('${esc(x.code)}')"><b>${p?WDS[p.wd]+' · '+p.short:esc(x.name)}</b><small>${st[0]}</small></button>`}).join('');
  if(!b){$('info').innerHTML=`<div class="info"><div class="bname">Hiện chưa mở đợt đặt bánh</div><div class="hint">Tiệm sẽ mở đợt mới sớm, bạn quay lại sau nhé!</div></div>`;$('seg').style.display='none';$('view').innerHTML='';document.body.classList.add('nobar');return}
  let p=dateParts(b),st=batchStatus(b);
  $('info').innerHTML=`<div class="info"><div class="infotop"><div><div class="bname">${esc(b.name)}</div><div class="hint">Nhận bánh: <b>${p?WD[p.wd]+', '+esc(b.pickupText):esc(b.pickupText)}</b></div>${b.deadlineText?`<div class="hint">Chốt đơn: <b>${esc(b.deadlineText)}</b></div>`:''}</div><span class="pill ${st[1]}">${st[0]}</span></div>${b.note?`<div class="bnote">${esc(b.note)}</div>`:''}</div>`;
  $('seg').style.display='grid';
  let n=(shop.orders||[]).filter(o=>o.status!=='HỦY').length;
  $('tabMenu').classList.toggle('on',view==='menu');$('tabList').classList.toggle('on',view==='list');$('tabList').textContent='Đơn trong đợt ('+n+')';
  view==='menu'?renderMenu():renderList();
  document.body.classList.toggle('nobar',!(view==='menu'&&b.open));
  calc();
}
function renderMenu(){
  let b=shop.batch,html='';
  if(!b.open)html+=`<div class="notice">Đợt này đã ngừng nhận đơn. Bạn vẫn theo dõi được trạng thái đơn ở mục <b>“Đơn trong đợt”</b>.</div>`;
  if(!products.length)html+=`<div class="empty">Đợt này chưa có bánh mở bán.</div>`;
  html+=products.map(p=>{let out=+p.stock<=0,dis=!b.open||out;return`<div class="card"><div class="pinfo"><div class="pimgwrap" onclick="openAlbum('${esc(p.id)}')" role="button" aria-label="Xem album ${esc(p.name)}"><img class="pimg" src="${esc(p.imageUrl||PRODUCT_IMAGES[p.id]||PRODUCT_IMAGES.B006)}" alt="${esc(p.name)}" loading="lazy">${albumOf(p).length>1?`<span class="albadge">📷 ${albumOf(p).length}</span>`:''}</div><div><div class="name">${esc(p.name)}</div>${p.desc?`<div class="desc">${esc(p.desc)}</div>`:''}<div class="price">${money(p.price)}</div></div></div><div class="qtywrap"><div class="qtystock ${out?'out':''}">${out?'Hết bánh':`Còn <strong>${p.stock}</strong> bánh`}</div><div class="qty"><button onclick="chg('${esc(p.id)}',-1)" ${dis?'disabled':''}>−</button><b id="q-${esc(p.id)}">${cart[p.id]||0}</b><button onclick="chg('${esc(p.id)}',1)" ${dis?'disabled':''}>+</button></div></div></div>`}).join('');
  $('view').innerHTML=html;
}
function myRecords(){return store.get(MY_KEY,[]).filter(m=>m.batch===cur)}
function addMine(rec){let all=store.get(MY_KEY,[]).filter(m=>!(m.id===rec.id&&m.batch===rec.batch));all.push({...rec,t:Date.now()});store.set(MY_KEY,all.slice(-60))}
function steps(status){if(status==='HỦY')return`<div class="notice" style="margin:4px 0 0">Đơn đã bị hủy. Vui lòng liên hệ tiệm nếu cần hỗ trợ.</div>`;let idx=STEPS.indexOf(status);return`<div class="steps">${STEPS.map((s,i)=>`<div class="step ${i<=idx?'done':''} ${i===idx?'cur':''}"><i></i><span>${LABEL[s]}</span></div>`).join('')}</div>`}
function myCard(m,o){
  if(!o)return`<div class="mycard"><div class="myhead"><div><b>${esc(m.id)}</b><div class="hint">Vừa gửi</div></div><span class="pill wait">Đang ghi nhận…</span></div><div class="hint" style="margin-top:8px">Tiệm đang nhận đơn của bạn, danh sách sẽ tự cập nhật sau ít giây.</div></div>`;
  return`<div class="mycard"><div class="myhead"><div><b>${esc(o.id)}</b><div class="hint">${esc(o.timeText)}</div></div><div class="pay">${money(o.total)}</div></div><div class="myitems">${(o.items||[]).map(i=>esc(i.name)+' × '+esc(i.qty)).join('<br>')||esc(o.itemsText)}</div>${steps(o.status)}</div>`;
}
function renderList(){
  let orders=shop.orders||[],byId={};orders.forEach(o=>byId[o.id]=o);
  let mine=myRecords(),mineIds=new Set(mine.map(m=>m.id));
  let html=`<div class="sec">Đơn của bạn</div>`;
  html+=mine.length?mine.slice().reverse().map(m=>myCard(m,byId[m.id])).join(''):`<div class="hint">Chưa có đơn của bạn trong đợt này trên máy này. Đã đặt bằng máy khác? Nhập số điện thoại để tìm:</div>`;
  html+=`<div class="lookup"><input id="lkPhone" inputmode="tel" placeholder="Số điện thoại đã đặt"><button class="mini" onclick="lookup()">Tìm đơn</button></div>`;
  let cnt={};orders.forEach(o=>cnt[o.status]=(cnt[o.status]||0)+1);
  html+=`<div class="sec"><div>Tất cả đơn trong đợt <span>(${orders.length})</span></div><button class="mini" onclick="load(cur,{silent:true,keepCart:true}).then(()=>toast('Đã cập nhật'))">↻ Cập nhật</button></div>`;
  if(orders.length)html+=`<div class="stats">${Object.keys(LABEL).filter(s=>cnt[s]).map(s=>`<span class="pill ${ST_CLASS[s]}">${cnt[s]} ${LABEL[s].toLowerCase()}</span>`).join('')}</div>`;
  html+=orders.length?orders.map((o,i)=>{let me=mineIds.has(o.id);return`<div class="orow ${me?'me':''}"><div class="onum">${i+1}</div><div class="omain"><div class="oname">${esc(o.name)} <span class="tail">***${esc(o.phoneTail)}</span>${me?'<span class="you">Bạn</span>':''}</div><div class="oitems">${esc((o.items||[]).map(x=>x.name+' x'+x.qty).join(', ')||o.itemsText)}</div></div><span class="pill ${ST_CLASS[o.status]||''}">${esc(LABEL[o.status]||o.status)}</span></div>`}).join(''):`<div class="empty">Chưa có đơn nào trong đợt này.${shop.batch.open?'<br>Hãy là người đặt đầu tiên!':''}</div>`;
  $('view').innerHTML=html;
}
async function lookup(){let ph=$('lkPhone').value.trim();if(ph.replace(/\D/g,'').length<9)return alert('Nhập đúng số điện thoại giúp tiệm nhé.');try{let r=await jsonp({api:'lookup',batch:cur,phone:ph});if(!r.success)return alert(r.message||'Không tìm được');if(!(r.orders||r.ids).length)return alert('Không tìm thấy đơn nào với số này.');(r.orders||r.ids.map(id=>({id,batch:cur}))).forEach(x=>addMine({id:x.id,batch:x.batch,phone:ph}));render();toast('Đã tìm thấy '+(r.orders||r.ids).length+' đơn')}catch(e){alert(e.message)}}

/* ---------- ALBUM ẢNH ---------- */
let lb={p:null,list:[],i:0};
function albumOf(p){let a=[p.imageUrl||PRODUCT_IMAGES[p.id]||PRODUCT_IMAGES.B006].concat(p.album||[]);return a.filter((u,i)=>u&&a.indexOf(u)===i)}
function openAlbum(id){let p=products.find(x=>x.id===id);if(!p)return;lb={p,list:albumOf(p),i:0};$('lbName').textContent=p.name;$('lbDesc').textContent=p.desc||'';$('lbPrice').textContent=money(p.price);$('lbThumbs').innerHTML=lb.list.length>1?lb.list.map((u,i)=>`<img src="${esc(u)}" alt="" loading="lazy" onclick="lbShow(${i})">`).join(''):'';$('lb').classList.add('on');document.body.style.overflow='hidden';lbShow(0)}
function lbShow(i){let n=lb.list.length;lb.i=(i+n)%n;$('lbImg').src=lb.list[lb.i];$('lbCount').textContent=n>1?(lb.i+1)+' / '+n:'';document.querySelectorAll('.lbnav').forEach(b=>b.style.display=n>1?'':'none');[...$('lbThumbs').children].forEach((t,k)=>t.classList.toggle('on',k===lb.i));let on=$('lbThumbs').children[lb.i];on&&on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});let nx=lb.list[(lb.i+1)%n];if(nx){let im=new Image();im.src=nx}let p=lb.p,can=shop&&shop.batch&&shop.batch.open&&(cart[p.id]||0)<+p.stock;$('lbAdd').disabled=!can;$('lbAdd').textContent=!shop||!shop.batch||!shop.batch.open?'Đợt chưa mở':+p.stock<=0?'Hết bánh':(cart[p.id]?'+ Thêm ('+cart[p.id]+')':'+ Chọn bánh')}
function lbGo(d){lbShow(lb.i+d)}
function lbAddCart(){chg(lb.p.id,1);toast('Đã chọn '+lb.p.name+' × '+cart[lb.p.id]);lbShow(lb.i)}
function closeAlbum(){$('lb').classList.remove('on');document.body.style.overflow=''}
(function(){let x0=null;const st=$('lbStage');st.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});st.addEventListener('touchend',e=>{if(x0===null)return;let dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40)lbGo(dx<0?1:-1)});st.addEventListener('click',e=>{if(e.target===st)closeAlbum()});document.addEventListener('keydown',e=>{if(!$('lb').classList.contains('on'))return;if(e.key==='Escape')closeAlbum();if(e.key==='ArrowRight')lbGo(1);if(e.key==='ArrowLeft')lbGo(-1)})})();

/* ---------- GIỎ HÀNG ---------- */
function chg(id,n){let p=products.find(x=>x.id===id);if(!p||!shop.batch.open)return;cart[id]=Math.max(0,Math.min(+p.stock,(cart[id]||0)+n));let q=$('q-'+id);if(q)q.textContent=cart[id];calc()}
function totals(){let qty=0,total=0;products.forEach(p=>{let q=cart[p.id]||0;qty+=q;total+=q*p.price});return{qty,total}}
function calc(){let t=totals();$('total').textContent=money(t.total);$('qt').textContent=t.qty?t.qty+' bánh đã chọn':'Chưa chọn bánh';$('order').disabled=!t.qty;return t}
function cartSig(){return products.filter(p=>(cart[p.id]||0)>0).map(p=>p.id+':'+cart[p.id]).sort().join('|')}

/* ---------- ĐẶT & THANH TOÁN ---------- */
function openOrder(){if(!shop.batch.open)return;let t=calc(),b=shop.batch;$('modal').classList.add('on');$('sheet').innerHTML=`<div class="handle"></div><h2>Thông tin nhận bánh</h2><div class="hint">${esc(b.name)} · Nhận bánh ${esc(b.pickupText)}</div><label>Tên khách hàng</label><input id="name" autocomplete="name"><label>Số điện thoại</label><input id="phone" inputmode="tel" autocomplete="tel"><label>Ghi chú</label><textarea id="note" placeholder="VD: giờ lấy bánh, giao hàng..."></textarea><div class="totalbox"><span>${t.qty} bánh</span><strong>${money(t.total)}</strong></div><button class="primary" onclick="pay()">Tiếp tục thanh toán</button><button class="secondary" onclick="closeM()">Quay lại</button>`;let last=store.get('nhango_customer',null);if(last){$('name').value=last.name||'';$('phone').value=last.phone||''}}
function makeOrderCode(){let d=new Date(),p=n=>String(n).padStart(2,'0');return'NG'+p(d.getDate())+p(d.getMonth()+1)+String(d.getFullYear()).slice(-2)+'-'+String(Date.now()).slice(-5)}
function pay(){let name=$('name').value.trim(),phone=$('phone').value.trim(),note=$('note').value.trim();if(!name||!phone)return alert('Nhập tên và số điện thoại giúp tiệm nhé.');if(phone.replace(/\D/g,'').length<9)return alert('Số điện thoại chưa đúng.');store.set('nhango_customer',{name,phone});let sig=cartSig(),saved=store.get(PENDING_KEY,null);let reuse=saved&&saved.phone===phone&&saved.sig===sig&&saved.batch===cur&&Date.now()-saved.createdAt<15*60*1000;let orderCode=reuse?saved.orderCode:makeOrderCode();let pending={orderCode,name,phone,note,sig,batch:cur,createdAt:reuse?saved.createdAt:Date.now(),cart:{...cart},stage:'payment'};store.set(PENDING_KEY,pending);window.customer={name,phone,note,orderCode};showPayment(pending)}
function restorePending(){let p=store.get(PENDING_KEY,null);if(!p||p.stage!=='payment'||!p.cart||p.batch!==cur||Date.now()-p.createdAt>15*60*1000||!shop.batch||!shop.batch.open)return;let has=false;products.forEach(x=>{let q=Math.max(0,Math.min(+x.stock,+(p.cart[x.id]||0)));cart[x.id]=q;if(q)has=true});if(!has)return;view='menu';render();window.customer={name:p.name,phone:p.phone,note:p.note||'',orderCode:p.orderCode};$('modal').classList.add('on');showPayment(p)}
function showPayment(p){
  let t=calc(),orderCode=p.orderCode,transfer='NHA NGO '+orderCode,qr='https://img.vietqr.io/image/VCB-0181003445625-compact2.png?amount='+t.total+'&addInfo='+encodeURIComponent(transfer)+'&accountName=NGO%20XUAN%20DUY';
  $('sheet').innerHTML=`<div class="handle"></div><h2>Thanh toán</h2><div class="hint" style="margin-bottom:8px"><b>Đơn đang được giữ trên điện thoại này.</b><br>Nếu bạn sang app ngân hàng rồi quay lại, Nhà Ngô sẽ tự khôi phục màn hình này.</div><div class="pay">${money(t.total)}</div><div class="ordercode">Mã đơn: ${esc(orderCode)}</div><div class="bank">Ngân hàng: <b>Vietcombank</b><br>Số tài khoản: <b>0181003445625</b><button class="copybtn" onclick="copyText('0181003445625','Đã sao chép số tài khoản')">Sao chép</button><br>Chủ tài khoản: <b>NGO XUAN DUY</b><div class="paynote">Nội dung chuyển khoản:<br><b>${esc(transfer)}</b><button class="copybtn" onclick="copyText('${esc(transfer)}','Đã sao chép nội dung')">Sao chép</button></div></div><div class="qrbox"><div class="hint">QR đã điền sẵn <b>số tiền + mã đơn</b></div><img id="payQR" src="${qr}" alt="QR thanh toán Vietcombank"><div class="hint" style="margin-top:10px"><b>Mở app ngân hàng</b></div><div class="bankapps"><button class="bankapp" onclick="openBank('vcb')">Vietcombank</button><button class="bankapp" onclick="openBank('mb')">MB Bank</button><button class="bankapp" onclick="openBank('bidv')">BIDV</button><button class="bankapp" onclick="openBank('icb')">VietinBank</button><button class="bankapp" onclick="openBank('acb')">ACB</button><button class="bankapp" onclick="openBank('ocb')">OCB</button></div><button class="secondary" style="margin-top:5px" onclick="payOnPhone()">Lưu / mở riêng mã QR</button><div class="hint">Nếu ngân hàng không tự điền thông tin, hãy dùng QR đã tạo phía trên.</div></div><div class="proof"><label style="margin-top:0">Ảnh xác nhận thanh toán</label><input id="proofFile" type="file" accept="image/*" onchange="previewProof(this)"><img id="proofPreview" class="preview"><div class="hint">Thanh toán xong, chụp màn hình giao dịch thành công rồi tải ảnh lên.</div></div><button class="primary" id="submitBtn" onclick="submitOrder()">Xác nhận & gửi đơn</button><button class="secondary" onclick="closeM()">Đóng</button>`
}
function copyText(v,msg){navigator.clipboard?navigator.clipboard.writeText(v).then(()=>toast(msg||'Đã sao chép'),()=>prompt('Sao chép nội dung này:',v)):prompt('Sao chép nội dung này:',v)}
function openBank(app){let t=calc(),transfer=('NHANGO '+window.customer.orderCode).replace(/[^A-Za-z0-9 ]/g,'').slice(0,40),u='https://dl.vietqr.io/pay?app='+encodeURIComponent(app)+'&ba=0181003445625@vcb&am='+t.total+'&tn='+encodeURIComponent(transfer)+'&bn='+encodeURIComponent('NGO XUAN DUY')+'&url='+encodeURIComponent(location.origin+location.pathname);location.href=u}
function payOnPhone(){let im=$('payQR');if(!im)return;let w=window.open(im.src,'_blank');if(!w)location.href=im.src}
function previewProof(inp){let f=inp.files&&inp.files[0],im=$('proofPreview');if(!f){im.style.display='none';return}im.src=URL.createObjectURL(f);im.style.display='block'}
function fileData(f){return new Promise((ok,no)=>{let r=new FileReader();r.onerror=no;r.onload=()=>{let im=new Image();im.onerror=no;im.onload=()=>{let max=1280,w=im.width,h=im.height;if(w>max||h>max){let s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s)}let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);ok(cv.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(f)})}
function postAndWait(){return new Promise(ok=>{let fr=$('submitFrame'),done=false,fin=()=>{if(!done){done=true;fr.onload=null;ok()}};fr.onload=fin;setTimeout(fin,25000);$('postForm').submit()})}
async function submitOrder(){
  if(window.orderSubmitting)return;let f=$('proofFile')&&$('proofFile').files[0];if(!f)return alert('Vui lòng tải ảnh xác nhận thanh toán.');if(f.size>12*1024*1024)return alert('Ảnh quá lớn. Vui lòng chọn ảnh dưới 12MB.');
  let btn=$('submitBtn');window.orderSubmitting=true;btn.disabled=true;btn.textContent='Đang gửi đơn...';
  try{let items=products.filter(p=>cart[p.id]>0).map(p=>({id:p.id,qty:cart[p.id]}));let paymentImage=await fileData(f);$('payload').value=JSON.stringify({...window.customer,batchCode:cur,items,paymentImage,paymentImageName:f.name||'thanh-toan.jpg'});await postAndWait();
    addMine({id:window.customer.orderCode,batch:cur,phone:window.customer.phone});store.del(PENDING_KEY);window.orderSubmitting=false;
    $('sheet').innerHTML=`<div class="handle"></div><div class="ok"><div class="tick">✓</div><h2>Đã gửi đơn</h2><p>Mã đơn <b>${esc(window.customer.orderCode)}</b> đã được gửi.<br>Tiệm sẽ kiểm tra chuyển khoản và cập nhật trạng thái đơn trong mục <b>“Đơn trong đợt”</b>.</p><button class="primary" onclick="afterSubmit()">Xem trạng thái đơn</button></div>`}
  catch(e){window.orderSubmitting=false;btn.disabled=false;btn.textContent='Xác nhận & gửi đơn';alert('Không thể xử lý ảnh. Vui lòng thử lại.')}
}
function afterSubmit(){closeM();Object.keys(cart).forEach(k=>cart[k]=0);view='list';render();window.scrollTo({top:0});load(cur,{silent:true});setTimeout(()=>load(cur,{silent:true,keepCart:true}),6000)}
function closeM(){$('modal').classList.remove('on')}

/* ---------- KHỞI ĐỘNG ---------- */
setInterval(()=>{if(document.visibilityState==='visible'&&view==='list'&&!$('modal').classList.contains('on'))load(cur,{silent:true,keepCart:true})},45000);
(function init(){let p=store.get(PENDING_KEY,null),q=new URLSearchParams(location.search).get('dot');let code=(p&&p.stage==='payment'&&p.batch&&Date.now()-p.createdAt<15*60*1000)?p.batch:(q||store.get(BATCH_KEY,''));load(code)})();
</script></body></html>
