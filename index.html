<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d1916"><title>Tiệm Bánh Nhà Ngô</title>
<style>
@font-face{font-family:'MTD Auckland';src:url('./MTD%20Auckland%20Script.otf') format('opentype');font-style:normal;font-weight:400;font-display:swap}
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap');
*{box-sizing:border-box}body{margin:0;background:#1d1916;color:#f7f1e9;font-family:'Be Vietnam Pro',system-ui,sans-serif;padding-bottom:100px}.wrap{max-width:600px;margin:auto;padding:20px 14px}h1,h2{font-family:'MTD Auckland','DM Serif Display',Georgia,serif}h1{margin:4px 0;font-size:30px;color:#fff8ef;font-weight:400}.sub{color:#d7aa88;margin:5px 0 20px;font-size:14px}.card{background:#29231f;border:1px solid #44382f;border-radius:18px;padding:16px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 4px 16px #4d2b1510}.pinfo{display:flex;align-items:center;gap:13px;min-width:0;flex:1}.pimg{width:88px;height:88px;object-fit:cover;border-radius:14px;flex:0 0 88px;background:#352d27}.name{font-size:17px;font-weight:800;color:#fff8ef}.price{font-size:17px;font-weight:800;color:#f0b36f;margin-top:7px}.stock{font-size:12px;color:#c8b8aa;margin-top:5px}.qtywrap{flex:0 0 auto;text-align:center}.qtystock{display:inline-flex;align-items:center;justify-content:center;align-self:flex-end;font-size:12px;line-height:1;color:#eaffdf;background:#315c38;border:1px solid #477a50;border-radius:999px;padding:6px 9px;margin:0 0 6px;font-weight:500;white-space:nowrap}.qtystock strong{font-size:14px;font-weight:800;color:#fff;margin:0 2px}.qtystock strong{font-size:15px;color:#fff8ef;font-weight:800}.qty{display:flex;align-items:center;gap:7px;background:#171310;padding:5px;border-radius:15px}.qty button{width:46px;height:46px;border:1px solid #55463b;border-radius:12px;background:#302822;color:#f0b36f;font-size:25px}.qty b{min-width:28px;text-align:center;font-size:18px}.bar{position:fixed;bottom:0;left:0;right:0;background:#1d1916f5;border-top:1px solid #44382f;padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:8}.barin{max-width:600px;margin:auto;display:grid;grid-template-columns:1fr 1.15fr;gap:10px;align-items:center}.sum small{display:block;color:#c8b8aa}.sum strong{font-size:21px;color:#fff8ef}.primary{width:100%;min-height:54px;border:0;border-radius:14px;background:#b45112;color:#fff8ef;font-size:16px;font-weight:800}.primary:disabled{opacity:.45}.modal{display:none;position:fixed;z-index:20;inset:0;background:#1d1916aa;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-width:600px;margin:auto;background:#211c18;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}.sheet h2{font-size:27px;font-weight:400;margin:8px 0 18px}.handle{width:42px;height:5px;background:#d9ccc1;border-radius:8px;margin:0 auto 14px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;color:#eaded3}input,textarea{width:100%;font-family:inherit;font-size:16px;padding:14px;border:1px solid #514239;border-radius:13px;background:#302822;color:#fff8ef}textarea{min-height:72px}.qrbox{text-align:center;background:#29231f;border:1px solid #44382f;border-radius:16px;padding:12px;margin:10px 0}.qrbox img{width:min(230px,68vw);height:auto;border-radius:10px}.proof{margin:10px 0;padding:12px;background:#302822;border-radius:14px}.proof input{background:#fff}.preview{display:none;margin-top:10px;width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:#fff}.totalbox{display:flex;justify-content:space-between;background:#201b18;color:#fff;padding:15px;border-radius:13px;margin:18px 0}.bank{background:#302822;padding:12px 14px;border-radius:15px;line-height:1.65;font-size:13px}.pay{font-family:'MTD Auckland','DM Serif Display',Georgia,serif;font-size:31px;color:#f0b36f}.ordercode{display:inline-flex;margin:9px 0 2px;padding:7px 11px;border-radius:999px;background:#3b2d24;border:1px solid #6c4a32;color:#ffd4a3;font-size:13px;font-weight:800;letter-spacing:.4px}.paynote{margin-top:12px;padding:11px 12px;border-radius:12px;background:#1d1916;border:1px dashed #76543d;font-size:13px;line-height:1.55}.copybtn{border:0;border-radius:10px;background:#4a3a30;color:#fff8ef;padding:8px 10px;font:700 12px 'Be Vietnam Pro',sans-serif;margin-left:6px}.qrbox .primary{margin-top:10px;min-height:46px}.bankapps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.bankapp{border:1px solid #5b493d;background:#302822;color:#fff8ef;border-radius:11px;padding:10px 5px;font:700 12px 'Be Vietnam Pro',sans-serif}.bankapp:first-child{border-color:#b45112;background:#4a2b1c}@media(max-width:390px){.bankapps{grid-template-columns:repeat(2,1fr)}}.qrbox img{background:#fff;padding:6px}.hint{font-size:13px;color:#c8b8aa;line-height:1.5}.secondary{width:100%;min-height:46px;border:0;background:transparent;color:#c8b8aa;font-weight:700}.ok{text-align:center;padding:18px}.tick{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#f2e6dd;color:#a94200;font-size:32px;margin:auto}
@media(max-width:520px){body{padding-bottom:86px}.wrap{padding:12px 10px}h1{font-size:24px;line-height:1.05;margin:0}.sub{font-size:12px;margin:3px 0 9px}.card{padding:10px;margin:7px 0;gap:9px;border-radius:15px;min-height:92px}.pinfo{gap:10px;align-items:center}.pimg{width:72px;height:72px;flex-basis:72px;border-radius:12px}.pinfo>div{min-width:0;flex:1}.name{font-size:15px;line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{font-size:16px;margin-top:4px}.stock{font-size:11px;margin-top:3px}.qtywrap{flex:0 0 auto}.qtystock{font-size:12px;margin-bottom:4px}.qtystock strong{font-size:14px}.qty{gap:3px;padding:4px;border-radius:13px}.qty button{width:38px;height:38px;font-size:22px;border-radius:10px}.qty b{min-width:23px;font-size:16px}.bar{padding:7px 10px calc(7px + env(safe-area-inset-bottom))}.primary{min-height:48px}.sum strong{font-size:19px}}
</style></head><body>
<main class="wrap"><h1>Tiệm Bánh Nhà Ngô</h1><div class="sub">Bánh nướng tươi · Chốt đơn tự động</div><div id="products">Đang tải thực đơn...</div></main>
<div class="bar"><div class="barin"><div class="sum"><small id="qt">Chưa chọn bánh</small><strong id="total">0 đ</strong></div><button class="primary" id="order" disabled onclick="openOrder()">Đặt bánh</button></div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<iframe name="submitFrame" style="display:none"></iframe><form id="postForm" method="post" target="submitFrame" action="https://script.google.com/macros/s/AKfycbyzJFINy2DsPThTCPLcB1E-1PeUmoQxMChiYcJz6wENkEvzdWebII5gxcCMiGebkx5P/exec" style="display:none"><input name="payload" id="payload"></form>
<script>
const API='https://script.google.com/macros/s/AKfycbyzJFINy2DsPThTCPLcB1E-1PeUmoQxMChiYcJz6wENkEvzdWebII5gxcCMiGebkx5P/exec';const PRODUCT_IMAGES={B001:'https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=500&q=80',B002:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=500&q=80',B003:'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=500&q=80',B004:'https://images.unsplash.com/photo-1519915028121-7d3463d20b13?auto=format&fit=crop&w=500&q=80',B005:'https://images.unsplash.com/photo-1486427944299-d1955d23e34d?auto=format&fit=crop&w=500&q=80',B006:'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=500&q=80'};let products=[],cart={};const money=n=>(+n||0).toLocaleString('vi-VN')+' đ';
function receiveProducts(d){products=d||[];products.forEach(p=>cart[p.id]=0);render()}
function load(){let s=document.createElement('script');s.src=API+'?api=products&callback=receiveProducts&_='+Date.now();s.onerror=()=>document.getElementById('products').innerHTML='Không tải được thực đơn.';document.body.appendChild(s)}
function render(){document.getElementById('products').innerHTML=products.map(p=>`<div class="card"><div class="pinfo"><img class="pimg" src="${p.imageUrl||PRODUCT_IMAGES[p.id]||PRODUCT_IMAGES.B006}" alt="${p.name}" loading="lazy"><div><div class="name">${p.name}</div><div class="price">${money(p.price)}</div></div></div><div class="qtywrap"><div class="qtystock">Còn <strong>${p.stock}</strong> bánh</div><div class="qty"><button onclick="chg('${p.id}',-1)">−</button><b id="q-${p.id}">0</b><button onclick="chg('${p.id}',1)">+</button></div></div></div>`).join('');calc()}
function chg(id,n){let p=products.find(x=>x.id===id);cart[id]=Math.max(0,Math.min(+p.stock,(cart[id]||0)+n));document.getElementById('q-'+id).textContent=cart[id];calc()}
function totals(){let qty=0,total=0;products.forEach(p=>{let q=cart[p.id]||0;qty+=q;total+=q*p.price});return{qty,total}}
function calc(){let t=totals();total.textContent=money(t.total);qt.textContent=t.qty?t.qty+' bánh đã chọn':'Chưa chọn bánh';order.disabled=!t.qty;return t}
function openOrder(){let t=calc();modal.classList.add('on');sheet.innerHTML=`<div class="handle"></div><h2>Thông tin nhận bánh</h2><label>Tên khách hàng</label><input id="name" autocomplete="name"><label>Số điện thoại</label><input id="phone" inputmode="tel"><label>Ghi chú</label><textarea id="note"></textarea><div class="totalbox"><span>${t.qty} bánh</span><strong>${money(t.total)}</strong></div><button class="primary" onclick="pay()">Tiếp tục thanh toán</button><button class="secondary" onclick="closeM()">Quay lại</button>`}
function makeOrderCode(){let d=new Date(),p=n=>String(n).padStart(2,'0');return 'NG'+p(d.getDate())+p(d.getMonth()+1)+String(d.getFullYear()).slice(-2)+'-'+String(Date.now()).slice(-5)}
function copyText(v,msg){navigator.clipboard?navigator.clipboard.writeText(v).then(()=>alert(msg||'Đã sao chép')):prompt('Sao chép nội dung này:',v)}
function openBank(app){let t=calc(),transfer='NHA NGO '+window.customer.orderCode,u='https://dl.vietqr.io/pay?app='+encodeURIComponent(app)+'&ba=0181003445625@vcb&am='+t.total+'&tn='+encodeURIComponent(transfer)+'&bn='+encodeURIComponent('NGO XUAN DUY')+'&url='+encodeURIComponent(location.href);location.href=u}
function payOnPhone(){let im=document.getElementById('payQR');if(!im)return;let w=window.open(im.src,'_blank');if(!w)location.href=im.src}
function pay(){let name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),note=document.getElementById('note').value.trim();if(!name||!phone)return alert('Nhập tên và số điện thoại giúp tiệm nhé.');let orderCode=makeOrderCode();window.customer={name,phone,note,orderCode};let t=calc(),transfer='NHA NGO '+orderCode,qr='https://img.vietqr.io/image/VCB-0181003445625-compact2.png?amount='+t.total+'&addInfo='+encodeURIComponent(transfer)+'&accountName=NGO%20XUAN%20DUY';sheet.innerHTML=`<div class="handle"></div><h2>Thanh toán</h2><div class="pay">${money(t.total)}</div><div class="ordercode">Mã đơn: ${orderCode}</div><div class="bank">Ngân hàng: <b>Vietcombank</b><br>Số tài khoản: <b>0181003445625</b><button class="copybtn" onclick="copyText('0181003445625','Đã sao chép số tài khoản')">Sao chép</button><br>Chủ tài khoản: <b>NGO XUAN DUY</b><div class="paynote">Nội dung chuyển khoản:<br><b>${transfer}</b><button class="copybtn" onclick="copyText('${transfer}','Đã sao chép nội dung')">Sao chép</button></div></div><div class="qrbox"><div class="hint">QR đã điền sẵn <b>số tiền + mã đơn</b></div><img id="payQR" src="${qr}" alt="QR thanh toán Vietcombank"><div class="hint" style="margin-top:10px"><b>Mở app ngân hàng</b></div><div class="bankapps"><button class="bankapp" onclick="openBank('vcb')">Vietcombank</button><button class="bankapp" onclick="openBank('mb')">MB Bank</button><button class="bankapp" onclick="openBank('bidv')">BIDV</button><button class="bankapp" onclick="openBank('icb')">VietinBank</button><button class="bankapp" onclick="openBank('acb')">ACB</button><button class="bankapp" onclick="openBank('ocb')">OCB</button></div><button class="secondary" style="margin-top:5px" onclick="payOnPhone()">Lưu / mở riêng mã QR</button><div class="hint">Nếu ngân hàng không tự điền thông tin, hãy dùng QR đã tạo phía trên.</div></div><div class="proof"><label style="margin-top:0">Ảnh xác nhận thanh toán</label><input id="proofFile" type="file" accept="image/*" onchange="previewProof(this)"><img id="proofPreview" class="preview"><div class="hint">Thanh toán xong, chụp màn hình giao dịch thành công rồi tải ảnh lên.</div></div><button class="primary" onclick="submitOrder()">Xác nhận & gửi đơn</button><button class="secondary" onclick="closeM()">Đóng</button>`}
async function saveQR(){let im=document.getElementById('payQR');try{let r=await fetch(im.src),b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=(window.customer?.orderCode||'NHA-NGO')+'-QR.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){window.open(im.src,'_blank')}}
function previewProof(inp){let f=inp.files&&inp.files[0],im=document.getElementById('proofPreview');if(!f){im.style.display='none';return}im.src=URL.createObjectURL(f);im.style.display='block'}
function fileData(f){return new Promise((ok,no)=>{let r=new FileReader();r.onerror=no;r.onload=()=>{let im=new Image();im.onerror=no;im.onload=()=>{let max=1280,w=im.width,h=im.height;if(w>max||h>max){let s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s)}let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);ok(cv.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(f)})}
async function submitOrder(){let input=document.getElementById('proofFile'),f=input&&input.files&&input.files[0];if(!f)return alert('Vui lòng tải ảnh xác nhận thanh toán.');if(f.size>12*1024*1024)return alert('Ảnh quá lớn. Vui lòng chọn ảnh dưới 12MB.');let items=products.filter(p=>cart[p.id]>0).map(p=>({id:p.id,qty:cart[p.id]}));let paymentImage=await fileData(f);document.getElementById('payload').value=JSON.stringify({...window.customer,items,paymentImage,paymentImageName:f.name||'thanh-toan.jpg'});document.getElementById('postForm').submit();sheet.innerHTML=`<div class="handle"></div><div class="ok"><div class="tick">✓</div><h2>Đã gửi đơn</h2><p>Tiệm sẽ kiểm tra chuyển khoản và xử lý đơn của bạn.</p><button class="primary" onclick="location.reload()">Hoàn tất</button></div>`}
function closeM(){modal.classList.remove('on')}load();
</script></body></html>
