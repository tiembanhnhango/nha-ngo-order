<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf2"><title>Nhà Ngô - Quản lý</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ed;color:#29241f;font-family:system-ui,-apple-system,Arial,sans-serif}.app{max-width:650px;margin:auto;min-height:100dvh;padding:16px 14px 90px}h1{font-size:25px;margin:4px 0}h2{margin:4px 0 10px}.muted{color:#766d65;font-size:13px}.login{min-height:85dvh;display:grid;place-items:center}.box,.card{background:#fff;border:1px solid #e9e0d5;border-radius:18px;padding:16px;box-shadow:0 3px 14px #3c28140d}.box{width:100%;max-width:420px}input,select,textarea{width:100%;font-size:16px;padding:13px;border:1px solid #ddd3c7;border-radius:12px;background:#fff;font-family:inherit}textarea{min-height:64px}label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}.btn{border:0;border-radius:13px;min-height:48px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.primary{background:#513725;color:white;width:100%}.ghost{background:#fff;border:1px solid #ded5ca;color:#513725}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:0;background:#f7f3edf2;padding:10px 0;z-index:5}.tab{background:#ebe4db;color:#594b40;font-size:13px;padding:8px 4px;min-height:44px}.tab.on{background:#513725;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.refresh{background:#fff;border:1px solid #ded5ca}.card{margin:10px 0}.orderhead{display:flex;justify-content:space-between;gap:10px}.oid{font-weight:900;font-size:16px}.money{font-weight:900;font-size:20px;color:#513725}.customer{font-size:17px;font-weight:800;margin-top:10px}.phone{color:#2d6b9f;text-decoration:none}.items{background:#faf7f2;padding:11px;border-radius:11px;margin:10px 0;line-height:1.5}.proofbtn{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;padding:10px 13px;border-radius:11px;background:#eef7f0;color:#287a45;text-decoration:none;font-weight:800;font-size:14px}.warn{background:#fff4e0;color:#8a5a00;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.statusline{display:flex;align-items:center;gap:10px;margin-top:12px}.statusline .stlabel{font-size:13px;font-weight:800;white-space:nowrap;color:#766d65}.statusline select{flex:1;font-weight:800;color:#513725;background:#fff;min-height:48px}
.prodtop{display:grid;grid-template-columns:92px minmax(0,1fr) 112px;align-items:start;gap:12px}.prodimg{width:92px;height:92px;border-radius:15px;object-fit:cover;background:#f1ebe4}.prodmeta{min-width:0}.imgchange{margin-top:8px;border:1px solid #ded5ca;background:#fff;color:#513725;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:800}.topactions{display:grid;gap:7px}.topactions .btn{min-height:40px;padding:7px 8px;font-size:13px}.prodrow{display:grid;grid-template-columns:auto minmax(70px,1fr) auto 80px;gap:8px;align-items:center;margin-top:10px}.prodrow label{margin:0;white-space:nowrap;font-size:12px}.prodrow input{min-width:0}@media(max-width:520px){.prodtop{grid-template-columns:80px minmax(0,1fr) 96px}.prodimg{width:80px;height:80px}.topactions .btn{font-size:12px}}
.save{background:#513725;color:#fff}.danger{background:#fff0ed;color:#a33325}.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));right:max(16px,calc((100vw - 650px)/2 + 16px));border:0;border-radius:50%;width:58px;height:58px;background:#513725;color:#fff;font-size:30px;box-shadow:0 6px 20px #0003}.empty{text-align:center;color:#777;padding:35px 10px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#29241f;color:white;padding:11px 16px;border-radius:12px;z-index:30;display:none}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.on{display:flex}.sheet{background:white;width:100%;max-width:650px;margin:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
.batchbar{display:flex;gap:8px;margin-top:12px}.batchbar select{flex:1;font-weight:800;color:#513725;min-height:48px}.batchbar .btn{white-space:nowrap}
.bcard{background:#513725;color:#fff;border-radius:18px;padding:14px 16px;margin-top:10px}.bcard .muted{color:#e6d6c6}.bcard .bname{font-size:20px;font-weight:900}.brow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.brow select{flex:1 1 150px;min-height:42px;padding:8px 10px;font-weight:800}.brow .btn{min-height:42px;padding:8px 12px;font-size:13px;background:#ffffff22;color:#fff;border:1px solid #ffffff44}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:#f1ebe4;color:#513725}.pill.open{background:#e2f4e6;color:#287a45}.pill.closed{background:#fff0ed;color:#a33325}
.sumrow{display:grid;grid-template-columns:minmax(0,1fr) auto 84px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f0e9e0}.sumrow:last-child{border:0}.sumrow b{font-size:15px}.bar{height:6px;border-radius:6px;background:#f1ebe4;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:#c26a2c}.sold{font-weight:900;color:#513725;white-space:nowrap}.sumrow input{padding:9px;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:#fff;border:1px solid #e9e0d5;border-radius:14px;padding:12px;text-align:center}.kpi b{display:block;font-size:20px;color:#513725}.kpi span{font-size:12px;color:#766d65}
.album{margin-top:12px;border-top:1px solid #f0e9e0;padding-top:10px}.albhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.albhead b{font-size:14px}.albhead .imgchange{margin:0}.albthumbs{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px}.ath{position:relative;flex:0 0 72px}.ath img{width:72px;height:72px;object-fit:cover;border-radius:11px;background:#f1ebe4;cursor:pointer;display:block}.ath.cover img{outline:3px solid #c26a2c;outline-offset:-3px}.ath .cv{position:absolute;left:4px;bottom:4px;background:#c26a2c;color:#fff;font-size:10px;font-weight:800;padding:2px 5px;border-radius:6px}.ath button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#a33325;color:#fff;font-size:14px;line-height:1;cursor:pointer}
.limits{display:grid;gap:8px}.limits div{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:center}.limits input{padding:10px;text-align:center}.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;margin-top:14px}.check input{width:20px;height:20px}
</style></head><body><main class="app" id="app"></main><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyzJFINy2DsPThTCPLcB1E-1PeUmoQxMChiYcJz6wENkEvzdWebII5gxcCMiGebkx5P/exec';const PRODUCT_IMAGES={B001:'https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=500&q=80',B002:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=500&q=80',B003:'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=500&q=80',B004:'https://images.unsplash.com/photo-1519915028121-7d3463d20b13?auto=format&fit=crop&w=500&q=80',B005:'https://images.unsplash.com/photo-1486427944299-d1955d23e34d?auto=format&fit=crop&w=500&q=80',B006:'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=500&q=80'};
const ORDER_ST=['CHỜ XÁC NHẬN','ĐÃ NHẬN TIỀN','ĐANG LÀM','HOÀN THÀNH','HỦY'],BATCH_ST=['ĐANG MỞ','ĐÃ CHỐT','KẾT THÚC'];
const ls={get(k){try{return localStorage.getItem(k)||''}catch(e){return''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let token=ls.get('ngo_admin_token'),batchCode=ls.get('ngo_admin_batch'),data={orders:[],products:[],batches:[],batch:null,summary:[]},tab='orders';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(+n||0).toLocaleString('vi-VN')+' đ';
function jsonp(params){return new Promise((ok,no)=>{let cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),timer=setTimeout(()=>{delete window[cb];s.remove();no(Error('Máy chủ Google phản hồi chậm. Bấm thử lại.'))},30000);window[cb]=x=>{clearTimeout(timer);delete window[cb];s.remove();ok(x)};s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();no(Error('Không kết nối được máy chủ'))};s.src=API+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.body.appendChild(s)})}
function sha256(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''))}
let challengePromise=null;
function prefetchChallenge(){if(!challengePromise)challengePromise=jsonp({api:'admin-challenge'}).catch(e=>{challengePromise=null;throw e});return challengePromise}
function loginView(msg=''){$('app').innerHTML=`<div class="login"><div class="box"><h1>🍞 Quản lý Nhà Ngô</h1><p class="muted">Đăng nhập dành cho chủ tiệm</p><label>Mật khẩu</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><p class="muted" style="color:#a33325">${esc(msg)}</p><button id="loginBtn" class="btn primary" onclick="login()">Đăng nhập</button></div></div>`;prefetchChallenge().catch(()=>{});setTimeout(()=>$('pw')?.focus(),100)}
async function login(){let btn=$('loginBtn');try{let pw=$('pw').value;if(!pw)return;if(btn){btn.disabled=true;btn.textContent='Đang vào...'}let ch=await prefetchChallenge();challengePromise=null;let proof=await sha256(pw+':'+ch.nonce);let r=await jsonp({api:'admin-login',nonce:ch.nonce,proof});if(!r.success)throw Error(r.message||'Sai mật khẩu');token=r.token;ls.set('ngo_admin_token',token);if(r.data&&r.data.success){setData(r.data)}else{await load()}}catch(e){challengePromise=null;loginView(e.message)}}
function setData(r){data={batches:[],batch:null,summary:[],...r};if(data.batch){batchCode=data.batch.code;ls.set('ngo_admin_batch',batchCode)}render()}
async function load(){try{let r=await jsonp({api:'admin-data',token,batch:batchCode||''});if(!r.success){if(/đăng nhập/i.test(r.message||'')){token='';ls.del('ngo_admin_token');return loginView('Phiên đăng nhập đã hết.')}throw Error(r.message)}setData(r)}catch(e){if(!data.products.length)loginView(e.message);else show(e.message)}}
function selectBatch(code){batchCode=code;ls.set('ngo_admin_batch',code);load()}

function dmy(iso){let m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]:''}
function batchPill(b){return b.open?'<span class="pill open">Đang nhận đơn</span>':`<span class="pill closed">${b.status==='ĐANG MỞ'?'Hết hạn đặt':b.status==='ĐÃ CHỐT'?'Đã chốt đơn':'Kết thúc'}</span>`}
function render(){
  let b=data.batch,active=data.orders.filter(o=>o.status!=='HOÀN THÀNH'&&o.status!=='HỦY'),done=data.orders.filter(o=>o.status==='HOÀN THÀNH'||o.status==='HỦY');
  let bar=data.batches.length?`<div class="batchbar"><select onchange="selectBatch(this.value)" aria-label="Chọn đợt">${data.batches.map(x=>`<option value="${esc(x.code)}" ${b&&x.code===b.code?'selected':''}>${dmy(x.pickupDate)} · ${esc(x.name)} — ${esc(x.status)}</option>`).join('')}</select><button class="btn ghost" onclick="newBatch()">+ Đợt mới</button></div>`
    :`<div class="card" style="margin-top:12px"><b>Chưa có đợt đặt nào</b><p class="muted">Tạo đợt đầu tiên để khách đặt bánh theo ngày. Đơn bên dưới là đơn cũ (sheet DON_HANG).</p><button class="btn primary" onclick="newBatch()">+ Tạo đợt đặt đầu tiên</button></div>`;
  let bcard=b?`<div class="bcard"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="bname">${esc(b.name)}</div><div class="muted">Nhận bánh ${esc(b.pickupText)}${b.deadlineText?' · Chốt '+esc(b.deadlineText):''}</div><div class="muted">Sheet: ${esc(b.sheetName)} · Mã ${esc(b.code)}</div></div>${batchPill(b)}</div><div class="brow"><select onchange="setBatchStatus(this.value)" aria-label="Trạng thái đợt">${BATCH_ST.map(s=>`<option ${b.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="editBatch()">Sửa</button><button class="btn" onclick="copyLink()">Copy link đợt</button></div></div>`:'';
  $('app').innerHTML=`<div class="top"><div><h1>🍞 Nhà Ngô</h1><div class="muted">Quản lý đợt đặt, đơn hàng & sản phẩm</div></div><button class="btn refresh" onclick="load()">↻</button></div>${bar}${bcard}<div class="tabs"><button class="btn tab ${tab==='orders'?'on':''}" onclick="tab='orders';render()">Đơn (${active.length})</button><button class="btn tab ${tab==='done'?'on':''}" onclick="tab='done';render()">Xong (${done.length})</button><button class="btn tab ${tab==='summary'?'on':''}" onclick="tab='summary';render()">Tổng hợp</button><button class="btn tab ${tab==='products'?'on':''}" onclick="tab='products';render()">Bánh (${data.products.length})</button></div><div id="content"></div>`;
  tab==='products'?products():tab==='summary'?summary():orders(tab==='done'?done:active)
}
function phoneFix(p){let d=String(p??'').replace(/[^\d+]/g,'');return /^[1-9]\d{8}$/.test(d)?'0'+d:d}
function orders(list){let el=$('content');if(!list.length)return el.innerHTML=`<div class="empty">${tab==='done'?'Chưa có đơn hoàn thành.':'Chưa có đơn cần xử lý.'}</div>`;el.innerHTML=list.map(o=>`<div class="card"><div class="orderhead"><div><div class="oid">${esc(o.id)}</div><div class="muted">${esc(o.timeText||'')}</div></div><div class="money">${money(o.total)}</div></div><div class="customer">${esc(o.name)}</div><a class="phone" href="tel:${esc(phoneFix(o.phone))}">☎ ${esc(phoneFix(o.phone))}</a><div class="items">${esc(o.items)}</div>${/CẦN KIỂM TRA/.test(o.note||'')?`<div class="warn">⚠️ ${esc(o.note)}</div>`:o.note?`<div class="muted">Ghi chú: ${esc(o.note)}</div>`:''}${/^https:\/\//i.test(o.paymentImage||'')?`<a class="proofbtn" href="${esc(o.paymentImage)}" target="_blank" rel="noopener">📷 Xem ảnh thanh toán</a>`:''}<div class="statusline"><span class="stlabel">Trạng thái</span><select onchange="status('${esc(o.id)}',this.value)" aria-label="Trạng thái đơn ${esc(o.id)}">${ORDER_ST.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>`).join('')}
function summary(){let el=$('content'),b=data.batch;if(!b)return el.innerHTML=`<div class="empty">Tạo đợt đặt để xem tổng hợp.</div>`;
  let valid=data.orders.filter(o=>o.status!=='HỦY'),rev=valid.reduce((s,o)=>s+(+o.total||0),0),paid=valid.filter(o=>o.status!=='CHỜ XÁC NHẬN').reduce((s,o)=>s+(+o.total||0),0),qty=data.summary.reduce((s,x)=>s+x.sold,0);
  let byPid={};data.summary.forEach(x=>byPid[x.id]=x);
  let rows=data.products.map(p=>{let x=byPid[p.id]||{sold:0,limit:0};let pct=x.limit?Math.min(100,Math.round(x.sold/x.limit*100)):0;return`<div class="sumrow"><div><b>${esc(p.name)}</b>${p.active?'':' <span class="muted">(ngừng bán)</span>'}<div class="bar"><i style="width:${pct}%"></i></div></div><div class="sold">${x.sold} / ${x.limit}</div><input id="lim-${esc(p.id)}" inputmode="numeric" value="${byPid[p.id]?x.limit:0}" aria-label="Số lượng mở bán ${esc(p.name)}"></div>`}).join('');
  el.innerHTML=`<div class="kpis"><div class="kpi"><b>${valid.length}</b><span>đơn hợp lệ</span></div><div class="kpi"><b>${qty}</b><span>bánh cần làm</span></div><div class="kpi"><b>${(rev/1000).toLocaleString('vi-VN')}k</b><span>doanh thu (${(paid/1000).toLocaleString('vi-VN')}k đã nhận)</span></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Bánh trong đợt</b><span class="muted">Đã đặt / Mở bán · Sửa số mở bán</span></div>${rows}<button class="btn primary" style="margin-top:12px" onclick="saveLimits(this)">Lưu số lượng mở bán</button></div>`}
function products(){let el=$('content');el.innerHTML=`<p class="muted">Cột “SL mặc định” là số lượng tự điền khi tạo đợt mới.</p>`+data.products.map(p=>`<div class="card"><div class="prodtop"><img class="prodimg" src="${esc(p.imageUrl||PRODUCT_IMAGES[p.id]||PRODUCT_IMAGES.B006)}" alt="${esc(p.name)}" loading="lazy"><div class="prodmeta"><div class="oid">${esc(p.name)}</div><div class="muted">${esc(p.id)}${p.active?'':' · ngừng bán'}</div><button class="imgchange" onclick="$('img-${esc(p.id)}').click()">Đổi ảnh</button><input id="img-${esc(p.id)}" type="file" accept="image/*" style="display:none" onchange="previewProductImage(this)"></div><div class="topactions"><button class="btn save" onclick="save('${esc(p.id)}')">Lưu</button><button class="btn danger" onclick="delp('${esc(p.id)}')">Xóa</button></div></div><div class="prodrow"><label>Giá</label><input id="price-${esc(p.id)}" inputmode="numeric" value="${p.price}"><label>SL mặc định</label><input id="stock-${esc(p.id)}" inputmode="numeric" value="${p.stock}"></div>${albumBox(p)}</div>`).join('');$('app').insertAdjacentHTML('beforeend','<button class="fab" onclick="newp()">+</button>')}

function post(action,payload){return new Promise(ok=>{let f=document.createElement('form');f.method='post';f.action=API;f.target='sink';f.style.display='none';let obj={api:action,token,...payload};Object.entries(obj).forEach(([k,v])=>{let i=document.createElement('input');i.name=k;i.value=typeof v==='object'?JSON.stringify(v):v;f.appendChild(i)});let fr=$('sink');if(!fr){fr=document.createElement('iframe');fr.name='sink';fr.id='sink';fr.style.display='none';document.body.appendChild(fr)}let done=false,fin=async()=>{if(done)return;done=true;fr.onload=null;await load();ok()};fr.onload=fin;setTimeout(fin,25000);document.body.appendChild(f);f.submit();f.remove()})}
async function status(id,st){show('Đang cập nhật...');await post('admin-status',{orderId:id,status:st,batch:batchCode});show('Đã cập nhật trạng thái')}
async function setBatchStatus(st){if(st==='KẾT THÚC'&&!confirm('Kết thúc đợt này? Khách sẽ không thấy đợt trong danh sách nữa (dữ liệu vẫn giữ trong sheet).'))return render();show('Đang cập nhật...');await post('admin-update-batch',{batchData:{code:batchCode,status:st}});show('Đã đổi trạng thái đợt')}
async function saveLimits(btn){let limits={};data.products.forEach(p=>{let v=+($('lim-'+p.id)?.value||0);if(v>0)limits[p.id]=v});btn.disabled=true;btn.textContent='Đang lưu...';await post('admin-update-batch',{batchData:{code:batchCode,limits}});show('Đã lưu số lượng')}
function copyLink(){let u=location.href.replace(/admin\.html.*$/,'').replace(/[?#].*$/,'')+'?dot='+encodeURIComponent(batchCode);(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>show('Đã copy link đợt'),()=>prompt('Link đợt:',u))}
function pad(n){return String(n).padStart(2,'0')}
function newBatch(){let t=new Date(Date.now()+864e5),iso=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());let act=data.products.filter(p=>p.active);$('modal').classList.add('on');$('sheet').innerHTML=`<h2>Tạo đợt đặt mới</h2><p class="muted">Hệ thống sẽ tự tạo một sheet đơn hàng riêng cho đợt này.</p><label>Ngày nhận bánh</label><input id="bdate" type="date" value="${iso}"><label>Tên đợt (tuỳ chọn)</label><input id="bname" placeholder="VD: Đợt bánh cuối tuần"><label>Hạn chốt đơn (tuỳ chọn)</label><input id="bdead" type="datetime-local"><label>Ghi chú cho khách</label><textarea id="bnote" placeholder="VD: Nhận bánh tại tiệm từ 15h–19h"></textarea><label>Số lượng mở bán</label><div class="limits">${act.map(p=>`<div><span>${esc(p.name)}</span><input id="nl-${esc(p.id)}" inputmode="numeric" value="${p.stock||0}"></div>`).join('')||'<span class="muted">Chưa có bánh đang bán.</span>'}</div><label class="check"><input id="bclose" type="checkbox"> Chốt các đợt đang mở khác</label><button class="btn primary" id="bcreate" style="margin-top:16px" onclick="createBatch()">Tạo đợt</button><button class="btn" style="width:100%;margin-top:6px;background:none" onclick="closeM()">Đóng</button>`}
async function createBatch(){let d=$('bdate').value;if(!d)return alert('Chọn ngày nhận bánh.');let limits={};data.products.filter(p=>p.active).forEach(p=>{let v=+($('nl-'+p.id)?.value||0);if(v>0)limits[p.id]=v});if(!Object.keys(limits).length)return alert('Nhập số lượng cho ít nhất 1 loại bánh.');let [y,m,dd]=d.split('-'),code='D'+dd+m+y.slice(2);let btn=$('bcreate');btn.disabled=true;btn.textContent='Đang tạo đợt...';batchCode=code;ls.set('ngo_admin_batch',code);await post('admin-create-batch',{batchData:{code,pickupDate:d,name:$('bname').value.trim(),deadline:$('bdead').value,note:$('bnote').value.trim(),limits,closeOthers:$('bclose').checked}});closeM();tab='orders';render();show('Đã tạo đợt mới')}
function editBatch(){let b=data.batch;$('modal').classList.add('on');$('sheet').innerHTML=`<h2>Sửa đợt</h2><label>Tên đợt</label><input id="ename" value="${esc(b.name)}"><label>Ngày nhận bánh</label><input id="edate" type="date" value="${esc(b.pickupDate)}"><label>Hạn chốt đơn</label><input id="edead" type="datetime-local" value="${esc(b.deadlineInput||'')}"><label>Ghi chú cho khách</label><textarea id="enote">${esc(b.note)}</textarea><button class="btn primary" style="margin-top:16px" onclick="saveBatch(this)">Lưu</button><button class="btn" style="width:100%;margin-top:6px;background:none" onclick="closeM()">Đóng</button>`}
async function saveBatch(btn){btn.disabled=true;btn.textContent='Đang lưu...';await post('admin-update-batch',{batchData:{code:batchCode,name:$('ename').value.trim(),pickupDate:$('edate').value,deadline:$('edead').value,note:$('enote').value.trim()}});closeM();show('Đã lưu đợt')}
function closeM(){$('modal').classList.remove('on')}
function previewProductImage(inp){let f=inp.files&&inp.files[0];if(!f)return;inp.closest('.prodtop').querySelector('.prodimg').src=URL.createObjectURL(f)}
async function save(id){let p=data.products.find(x=>x.id===id),inp=$('img-'+id),imageData='';if(inp&&inp.files&&inp.files[0])imageData=await productImageData(inp.files[0]);show('Đang lưu...');await post('admin-save-product',{product:{id,name:p.name,price:+$('price-'+id).value,stock:+$('stock-'+id).value,active:p.active!==false,imageData}});show('Đã lưu sản phẩm')}
function albumBox(p){let list=[p.imageUrl].concat(p.album||[]).filter(Boolean);return`<div class="album"><div class="albhead"><div><b>Album ảnh (${list.length})</b><div class="muted" style="font-size:12px">Bấm vào ảnh để đặt làm ảnh chính</div></div><button class="imgchange" onclick="$('alb-${esc(p.id)}').click()">+ Thêm ảnh</button><input id="alb-${esc(p.id)}" type="file" accept="image/*" multiple style="display:none" onchange="addAlbum('${esc(p.id)}',this)"></div>${list.length?`<div class="albthumbs">${list.map((u,i)=>`<div class="ath ${i===0?'cover':''}"><img src="${esc(u)}" alt="" loading="lazy" onclick="${i===0?'':`setCover('${esc(p.id)}','${esc(u)}')`}">${i===0?'<span class="cv">Ảnh chính</span>':`<button onclick="rmAlbum('${esc(p.id)}','${esc(u)}')" aria-label="Xoá ảnh">×</button>`}</div>`).join('')}</div>`:''}</div>`}
async function addAlbum(id,inp){let files=[...(inp.files||[])];if(!files.length)return;let p=data.products.find(x=>x.id===id),room=20-(p.album||[]).length;if(room<=0)return alert('Album đã đủ 20 ảnh.');files=files.slice(0,room);for(let i=0;i<files.length;i+=4){let chunk=files.slice(i,i+4);show('Đang tải ảnh '+(i+1)+'–'+(i+chunk.length)+' / '+files.length+'...');let add=[];for(const f of chunk)add.push(await productImageData(f));await post('admin-album',{albumData:{productId:id,add}})}show('Đã thêm '+files.length+' ảnh vào album')}
async function rmAlbum(id,u){if(!confirm('Xoá ảnh này khỏi album?'))return;show('Đang xoá...');await post('admin-album',{albumData:{productId:id,remove:[u]}});show('Đã xoá ảnh')}
async function setCover(id,u){if(!confirm('Đặt ảnh này làm ảnh chính của bánh?'))return;show('Đang cập nhật...');await post('admin-album',{albumData:{productId:id,cover:u}});show('Đã đổi ảnh chính')}
async function delp(id){if(confirm('Xóa sản phẩm này?')){await post('admin-delete-product',{productId:id});show('Đã xóa')}}
function newp(){$('modal').classList.add('on');$('sheet').innerHTML=`<h2>Thêm sản phẩm</h2><label>Mã sản phẩm</label><input id="nid" placeholder="VD: B005"><label>Tên bánh</label><input id="nname"><label>Giá bán</label><input id="nprice" inputmode="numeric"><label>SL mặc định mỗi đợt</label><input id="nstock" inputmode="numeric"><label>Mô tả ngắn</label><input id="ndesc"><label>Ảnh sản phẩm</label><input id="nimg" type="file" accept="image/*"><button class="btn primary" style="margin-top:16px" onclick="addp(this)">Thêm sản phẩm</button><button class="btn" style="width:100%;margin-top:6px;background:none" onclick="closeM()">Đóng</button>`}
function productImageData(f){return new Promise((ok,no)=>{let r=new FileReader();r.onerror=no;r.onload=()=>{let im=new Image();im.onerror=no;im.onload=()=>{let max=1200,w=im.width,h=im.height;if(w>max||h>max){let s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s)}let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);ok(cv.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)})}
async function addp(btn){let file=$('nimg').files&&$('nimg').files[0];if(!file)return alert('Chọn ảnh sản phẩm.');let product={id:$('nid').value.trim(),name:$('nname').value.trim(),price:+$('nprice').value,stock:+$('nstock').value,desc:$('ndesc').value.trim(),active:true};if(!product.id||!product.name||!product.price)return alert('Nhập đủ mã, tên và giá.');btn.disabled=true;btn.textContent='Đang thêm...';product.imageData=await productImageData(file);closeM();await post('admin-save-product',{product});show('Đã thêm sản phẩm')}
function show(t){let el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(show.t);show.t=setTimeout(()=>el.style.display='none',1800)}
token?load():loginView();
</script></body></html>
